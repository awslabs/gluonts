name: Nursery Tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        python-version: ['3.11']
        platform: [ubuntu-latest]

    runs-on: ${{ matrix.platform }}

    if: contains(github.event.pull_request.labels.*.name, 'pr:test-nursery')

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --python ${{ matrix.python-version }} --extra nursery --extra shell --extra test --extra sagemaker --extra m-competitions --extra rotbaum

    - name: Test with pytest
      run: |
        uv run pytest -n2 --doctest-modules test/nursery