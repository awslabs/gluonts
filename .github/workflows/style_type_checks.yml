name: Style and type checks

on: [push, pull_request]

jobs:
  style-type-checks:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      run: uv sync --python 3.11

    - name: Style check
      run: uv run ruff format --check src test

    - name: Type check
      run: uv run mypy src

    - name: Check license headers
      run: uv run python .devtools/license check src test