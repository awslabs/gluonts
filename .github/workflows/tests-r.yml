name: R Tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        python-version: ['3.12']
        platform: [ubuntu-latest]

    runs-on: ${{ matrix.platform }}

    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'pr:test-r')

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.2.3'

    - name: Install R dependencies
      run: |
        wget -qO- https://cloud.r-project.org/bin/linux/ubuntu/marutter_pubkey.asc | sudo tee -a /etc/apt/trusted.gpg.d/cran_ubuntu_key.asc
        sudo add-apt-repository "deb https://cloud.r-project.org/bin/linux/ubuntu $(lsb_release -cs)-cran40/"
        sudo apt-get install -y \
          libcairo-dev \
          libedit-dev \
          libnlopt-dev \
          libxml2-dev \
          libcurl4-openssl-dev
        Rscript -e 'install.packages(c("forecast", "nnfor", "hts"), repos="https://cloud.r-project.org")'

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install Python dependencies
      run: |
        uv sync --python ${{ matrix.python-version }} --extra test --extra R

    - name: Test with pytest
      run: |
        uv run pytest -n2 test/ext/r_forecast